      episode: "You tried to cook dinner for your parents. You burned everything — the rice, the sauce, somehow even the salad. They ate it anyway. Your mother said it was perfect. Your father asked for seconds."
      pleasure: 0.7
      arousal: 0.3
      dominance: -0.2
    - age: 14
      episode: "You saw a stray dog shivering by the road. You spent three hours trying to catch it. It bit you twice. You brought it home anyway. Your father let you keep it."
      pleasure: 0.5
      arousal: 0.5
      dominance: 0.2
    - age: 16
      episode: "The girl from school was in trouble — bullied by older kids. You intervened. You got beaten up. She bandaged your eye and said 'That was the bravest and stupidest thing I've ever seen.' You felt like you'd won every race ever run."
