# Eidos persistence (in-memory stores active via casehub-eidos-memory)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:manor;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create

# Qhorus persistence (in-memory stores via casehub-qhorus-persistence-memory)
# Named datasource satisfies JPA persistence unit — Flyway disabled (PostgreSQL-only migrations)
quarkus.datasource.qhorus.db-kind=h2
quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:qhorus;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.qhorus.database.generation=drop-and-create
quarkus.flyway.qhorus.migrate-at-start=false

# Exclude JPA stores that conflict with in-memory alternatives
quarkus.arc.exclude-types=io.casehub.eidos.runtime.health.jpa.JpaAgentStateStore,io.casehub.eidos.runtime.health.jpa.JpaCapabilitySpecializationStore,io.casehub.eidos.runtime.jpa.JpaAgentRegistry,io.casehub.eidos.runtime.health.jpa.JpaBehavioralSignalStore,io.casehub.eidos.runtime.registry.jpa.JpaAgentRegistry,io.casehub.eidos.runtime.health.jpa.JpaDispositionSignalStore

# Platform identity
casehub.platform.tenancy-id=wacky-manor
casehub.tenancy.default-id=wacky-manor

# Agent concurrency — 17 characters + enrichment calls need headroom
casehub.platform.agent.claude.max-concurrent-sessions=6

# LangChain4j adapter timeout — judge LLM calls can take >30s default
casehub.platform.agent.langchain4j.close-timeout=PT180S

# Use random port for tests — avoids port conflicts between runs
%test.quarkus.http.test-port=0

# Active characters — comma-separated list, empty = all
# Dev mode uses core 5 to limit LLM concurrency
%dev.manor.scenario.active-characters=penelope-pitstop,hooded-claw,ant-hill-mob,dick-dastardly,peter-perfect

# Scenario mode
manor.scenario.mode=scripted
manor.scenario.profile=baseline
manor.scenario.max-turns=300

# Observation accumulator thresholds
manor.observation.verbatim-threshold=10
manor.observation.grouped-threshold=15

# Narrator
manor.narrator.enabled=true
manor.narrator.event-threshold=5
manor.narrator.timer-seconds=15
