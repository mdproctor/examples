# Eidos persistence (in-memory stores active via casehub-eidos-memory)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:manor;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create

# Qhorus persistence (in-memory stores via casehub-qhorus-persistence-memory)
# Named datasource satisfies JPA persistence unit — Flyway disabled (PostgreSQL-only migrations)
quarkus.datasource.qhorus.db-kind=h2
quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:qhorus;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.qhorus.database.generation=drop-and-create
quarkus.flyway.qhorus.migrate-at-start=false

# Exclude JPA stores that conflict with in-memory alternatives
quarkus.arc.exclude-types=io.casehub.eidos.runtime.health.jpa.*,\
  io.casehub.eidos.runtime.jpa.*,\
  io.casehub.eidos.runtime.registry.jpa.*,\
  io.casehub.eidos.runtime.selector.*,\
  io.casehub.engine.runtime.**,\
  io.casehub.agency.AgencyBeans,\
  io.casehub.platform.credentials.NoOpLlmCredentialStore,\
  io.casehub.qhorus.runtime.store.jpa.**,\
  io.casehub.ledger.runtime.model.jpa.**,\
  io.casehub.ledger.runtime.store.jpa.**,\
  io.casehub.eidos.eval.**,\
  io.casehub.connectors.**,\
  io.casehub.neocortex.cognition.relationship.RelationshipStagePhase,\
  io.casehub.neocortex.cognition.belief.BeliefRevisionPhase,\
  io.casehub.testing.TestWorkerProvisioner,\
  io.casehub.testing.WorkResultSubmitter,\
  io.casehub.neocortex.mindmap.intelligence.MindMapExtractor,\
  io.casehub.neocortex.mindmap.intelligence.ExtractionRequestedObserver,\
  io.casehub.neocortex.mindmap.intelligence.SubThoughtExtractor,\
  io.casehub.neocortex.caps.llm.LlmSituationClassifier,\
  io.casehub.neocortex.cognition.reflection.LlmReflectionSynthesizer

# Keep Vertex backend factory from being removed as unused
quarkus.arc.unremovable-types=io.casehub.platform.agent.BackendInstanceFactory

# Platform identity
casehub.platform.tenancy-id=wacky-manor
casehub.tenancy.default-id=wacky-manor

# Agent concurrency — AIMD controls active prompt execution
# 18 = 5 character + 1 narrator + 5 mood + 1 bdi + 5 classify (all can coexist)
casehub.platform.agent.claude.max-concurrent-sessions=18
casehub.platform.agent.gate.concurrency.max=10
casehub.platform.agent.gate.acquire-timeout=PT120S

# Session context budget — supports plain number, 'k' suffix (e.g. 80k), or '%' of model context
manor.session.clear-at-tokens=80k

# Use random port for tests — avoids port conflicts between runs
%test.quarkus.http.test-port=0

# Active characters — comma-separated list, empty = all
# Dev mode uses 2 characters to limit LLM concurrency
%dev.manor.scenario.active-characters=penelope-pitstop,hooded-claw,ant-hill-mob,dick-dastardly,peter-perfect

# Scenario mode
manor.scenario.mode=scripted
manor.scenario.profile=baseline
manor.scenario.max-turns=300

# Cognitive render mode: true = hand-crafted prose from YAML (legacy), false = Barrett 4-channel framework
manor.cognitive.briefing-mode=true

# Observation accumulator thresholds
manor.observation.verbatim-threshold=10
manor.observation.grouped-threshold=15

# Narrator
manor.narrator.enabled=true
manor.narrator.event-threshold=5
manor.narrator.timer-seconds=15

# Consolidation — ensure all formation memories graduate in a single pass
casehub.mindmap.consolidation.graduation.max-per-pass=50

# Memory stack
manor.memory.recall-limit=20
manor.reflection.enabled=true
manor.reflection.max-unreflected=5
manor.reflection.importance-threshold=3.0
manor.reflection.max-source-memories=15
manor.decay.enabled=true
manor.decay.max-age-days=7
manor.decay.min-importance=0.2

# Appraisal — LLM evaluates situations against character drives and disposition
manor.appraisal.enabled=true

# Relational schema evolution — match subgraph name created by ManorCognitiveSeeder
casehub.cognition.relationship.subgraph=people

# Mood tuning — decay time constant in minutes (default 240 = 4 hours)
# Shorter values make mood fluctuate with scenario events; longer values keep mood stable
manor.mood.decay-minutes=20
manor.mood.max-displacement=1.0

# Classification audit and mode routing
manor.classification.audit-enabled=true
manor.classification.audit-log-path=docs/eval/classification-audit.jsonl
manor.classification.external-characters=

# Degree accumulator (dual-rate CUSUM) — lowered thresholds for faster drive adaptation
manor.classification.accumulator.allowance=0.15
manor.classification.accumulator.threshold=0.5
manor.classification.accumulator.decay=0.85
manor.classification.accumulator.slow-allowance=0.10
manor.classification.accumulator.slow-threshold=1.0
