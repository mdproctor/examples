scenario: help-desk-demo
description: "Helpdesk case lifecycle — REST injection, AI classification, and spotlight narration"
speed: 0.5
on-error: pause

sections:
  - label: "Bootstrap"
    steps:
      - label: "Load classification rules"
        name: bootstrap
        target: helpdesk
        commands:
          - action: bootstrap-classifications
            data:
              entries:
                - { match: laptop, category: HARDWARE, priority: HIGH }
                - { match: password, category: ACCESS, priority: LOW }
                - { match: install, category: SOFTWARE, priority: MEDIUM }
                - { match: printer, category: HARDWARE, priority: MEDIUM }

  - label: "Customer submits ticket"
    steps:
      - label: "Spotlight the intake form"
        name: spotlight-form
        target: browser
        trigger: { after: bootstrap, delay: 500 }
        commands:
          - action: spotlight
            target: { role: textbox, name: "Your name" }
            data:
              content: >
                The intake form captures customer details and routes
                to the right specialist team. The scenario fills in a
                hardware issue and submits it — just like a real user.
              position: right
              duration: 0

      - label: "Fill in customer name"
        name: fill-name
        target: browser
        trigger: { after: spotlight-form, delay: 500 }
        commands:
          - action: fill
            target: { role: textbox, name: "Your name" }
            value: "Alice"

      - label: "Describe the issue"
        name: fill-issue
        target: browser
        trigger: { after: fill-name, delay: 300 }
        commands:
          - action: fill
            target: { role: textbox, name: "Issue description" }
            value: "My laptop won't boot after yesterday's firmware update. It shows a blue screen with error code 0xDEAD001 for about two seconds, then powers off. I've tried holding the power button for 30 seconds but it keeps cycling. This is blocking all my work — I can't access any of my files or attend meetings."

      - label: "Submit the ticket"
        name: submit-ticket
        target: browser
        trigger: { after: fill-issue, delay: 500 }
        commands:
          - action: click
            target: { role: button, name: "Submit ticket" }

  - label: "Backend processes ticket"
    steps:
      - label: "Spotlight the confirmation"
        name: spotlight-ack
        target: browser
        trigger: { after: submit-ticket, delay: 1500 }
        commands:
          - action: spotlight
            target: { role: status, name: "Ticket confirmation" }
            data:
              content: >
                The platform created a case, ran the keyword classifier,
                and matched "laptop" to HARDWARE with HIGH priority.
                A work item is now assigned to the hardware specialist group.
              position: right
              duration: 0

      - label: "Verify ticket classified"
        name: verify-ticket
        target: helpdesk
        trigger: { after: spotlight-ack, delay: 500 }
        commands:
          - action: verify-ticket-exists
            await:
              match: { status: TRIAGED, category: HARDWARE }
              timeout: 5000

  - label: "Operations dashboard"
    steps:
      - label: "Navigate to operations"
        name: view-ops
        target: browser
        trigger: { after: verify-ticket, delay: 500 }
        commands:
          - action: click
            target: { role: button, name: "View operations" }

      - label: "Spotlight the dashboard"
        name: spotlight-ops
        target: browser
        trigger: { after: view-ops, delay: 1000 }
        commands:
          - action: spotlight
            target: { role: status, name: "Case metrics" }
            data:
              content: >
                Alice's case is running — classified as HARDWARE, HIGH
                priority. A work item is waiting for a specialist to claim it.
                Next, a second ticket arrives via the REST API.
              position: bottom
              duration: 0

  - label: "REST injection"
    steps:
      - label: "Inject a second ticket via REST"
        name: rest-inject
        target: helpdesk
        trigger: { after: spotlight-ops, delay: 1000 }
        commands:
          - action: rest-inject-chat
            data:
              from: "Bob"
              channelId: "slack"
              text: "Need to install VS Code on my locked-down machine"

      - label: "Spotlight the live update"
        name: spotlight-live
        target: browser
        trigger: { after: rest-inject, delay: 2000 }
        commands:
          - action: spotlight
            target: { role: status, name: "Case metrics" }
            data:
              content: >
                Bob's ticket just arrived via REST — the same chat injection
                endpoint, called directly by the scenario. The dashboard now
                shows two cases with work items for each specialist group.
              position: bottom
              duration: 0
              also:
                - role: row
                  name: Bob
                  content: "Bob's ticket — injected via REST, classified as SOFTWARE"
                  position: right

  - label: "Specialist resolves ticket"
    steps:
      - label: "Claim Alice's work item"
        name: claim-ticket
        target: browser
        trigger: { after: spotlight-live, delay: 1000 }
        commands:
          - action: wait
            target: { role: button, name: "Claim work item", within: { role: row, name: "Alice" } }
            data: { timeout: 5000 }
          - action: click
            target: { role: button, name: "Claim work item", within: { role: row, name: "Alice" } }

      - label: "Spotlight the claimed item"
        name: spotlight-claimed
        target: browser
        trigger: { after: claim-ticket, delay: 2500 }
        commands:
          - action: wait
            target: { role: button, name: "Complete work item", within: { role: row, name: "Alice" } }
            data: { timeout: 5000 }
          - action: spotlight
            target: { role: row, name: "Alice" }
            data:
              content: >
                The hardware specialist claimed Alice's ticket.
                Status changed from PENDING to IN_PROGRESS.
                Now clicking Resolve to enter the resolution.
              position: right
              duration: 0

      - label: "Click resolve"
        name: click-resolve
        target: browser
        trigger: { after: spotlight-claimed, delay: 1000 }
        commands:
          - action: click
            target: { role: button, name: "Complete work item", within: { role: row, name: "Alice" } }

      - label: "Enter resolution"
        name: enter-resolution
        target: browser
        trigger: { after: click-resolve, delay: 800 }
        commands:
          - action: wait
            target: { role: textbox, name: "Resolution", within: { role: dialog, name: "Resolve ticket" } }
            data: { timeout: 3000 }
          - action: fill
            target: { role: textbox, name: "Resolution", within: { role: dialog, name: "Resolve ticket" } }
            value: "BIOS reset resolved the boot loop. Firmware rollback applied."

      - label: "Confirm resolution"
        name: confirm-resolution
        target: browser
        trigger: { after: enter-resolution, delay: 500 }
        commands:
          - action: click
            target: { role: button, name: "Confirm resolution", within: { role: dialog, name: "Resolve ticket" } }

      - label: "Verify notification sent"
        name: verify-notif
        target: helpdesk
        trigger: { after: confirm-resolution, delay: 2000 }
        commands:
          - action: verify-notification
            await:
              match: { verified: "true" }
              timeout: 5000

      - label: "Spotlight the resolution"
        name: spotlight-resolved
        target: browser
        trigger: { after: verify-notif, delay: 1000 }
        commands:
          - action: spotlight
            target: { role: table, name: "Customer notifications" }
            data:
              content: >
                Case resolved. The engine fired the notify-customer binding,
                sending Alice a resolution message. The full lifecycle —
                intake, classification, routing, specialist resolution,
                and customer notification — all driven by the case definition YAML.
              position: left
              duration: 0
