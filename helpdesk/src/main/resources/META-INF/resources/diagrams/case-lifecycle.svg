<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="12" fill="#0f172a"/>

  <!-- Stage boxes -->
  <rect x="30" y="40" width="120" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="90" y="64" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">OPEN</text>
  <text x="90" y="82" text-anchor="middle" fill="#64748b" font-size="10">ticket created</text>

  <rect x="210" y="40" width="120" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="270" y="64" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">TRIAGED</text>
  <text x="270" y="82" text-anchor="middle" fill="#64748b" font-size="10">classified</text>

  <rect x="390" y="40" width="120" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="64" text-anchor="middle" fill="#fb923c" font-size="13" font-weight="600">ASSIGNED</text>
  <text x="450" y="82" text-anchor="middle" fill="#64748b" font-size="10">work item</text>

  <rect x="570" y="40" width="120" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="630" y="64" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="600">RESOLVED</text>
  <text x="630" y="82" text-anchor="middle" fill="#64748b" font-size="10">case complete</text>

  <!-- Arrows between stages -->
  <line x1="150" y1="68" x2="210" y2="68" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="68" x2="390" y2="68" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="68" x2="570" y2="68" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Binding labels on arrows -->
  <text x="180" y="58" text-anchor="middle" fill="#38bdf8" font-size="9" font-style="italic">triage</text>
  <text x="360" y="58" text-anchor="middle" fill="#38bdf8" font-size="9" font-style="italic">assign</text>
  <text x="540" y="58" text-anchor="middle" fill="#38bdf8" font-size="9" font-style="italic">resolve</text>

  <!-- Binding detail boxes -->
  <rect x="30" y="140" width="160" height="72" rx="6" fill="#172033" stroke="#1e3a5f" stroke-width="1"/>
  <text x="40" y="160" fill="#38bdf8" font-size="11" font-weight="600">triage</text>
  <text x="40" y="176" fill="#94a3b8" font-size="10">keyword-classifier</text>
  <text x="40" y="192" fill="#64748b" font-size="9">matches "laptop" → HARDWARE</text>
  <text x="40" y="204" fill="#64748b" font-size="9">matches "install" → SOFTWARE</text>

  <rect x="220" y="140" width="160" height="72" rx="6" fill="#172033" stroke="#1e3a5f" stroke-width="1"/>
  <text x="230" y="160" fill="#38bdf8" font-size="11" font-weight="600">assign-specialist</text>
  <text x="230" y="176" fill="#94a3b8" font-size="10">human task (work item)</text>
  <text x="230" y="192" fill="#64748b" font-size="9">HARDWARE → hw-specialist</text>
  <text x="230" y="204" fill="#64748b" font-size="9">SOFTWARE → sw-specialist</text>

  <rect x="410" y="140" width="160" height="72" rx="6" fill="#172033" stroke="#1e3a5f" stroke-width="1"/>
  <text x="420" y="160" fill="#38bdf8" font-size="11" font-weight="600">notify-resolution</text>
  <text x="420" y="176" fill="#94a3b8" font-size="10">notification-sender</text>
  <text x="420" y="192" fill="#64748b" font-size="9">sends resolution message</text>
  <text x="420" y="204" fill="#64748b" font-size="9">to customer via channel</text>

  <!-- Goal box -->
  <rect x="610" y="140" width="160" height="56" rx="6" fill="#14532d" stroke="#166534" stroke-width="1"/>
  <text x="620" y="160" fill="#4ade80" font-size="11" font-weight="600">✓ ticket-resolved</text>
  <text x="620" y="176" fill="#86efac" font-size="10">status=RESOLVED</text>
  <text x="620" y="192" fill="#86efac" font-size="10">notified=true</text>

  <!-- Connecting lines from stages to bindings -->
  <line x1="90" y1="96" x2="90" y2="140" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="270" y1="96" x2="300" y2="140" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="630" y1="96" x2="490" y2="140" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="630" y1="96" x2="690" y2="140" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <text x="30" y="260" fill="#475569" font-size="10">YAML-driven lifecycle: each binding fires on a context change filter</text>
  <rect x="30" y="275" width="10" height="10" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="46" y="284" fill="#64748b" font-size="9">Stage</text>
  <rect x="100" y="275" width="10" height="10" rx="2" fill="#172033" stroke="#1e3a5f" stroke-width="1"/>
  <text x="116" y="284" fill="#64748b" font-size="9">Binding (SPI)</text>
  <rect x="200" y="275" width="10" height="10" rx="2" fill="#14532d" stroke="#166534" stroke-width="1"/>
  <text x="216" y="284" fill="#64748b" font-size="9">Goal</text>
  <line x1="270" y1="280" x2="300" y2="280" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="306" y="284" fill="#64748b" font-size="9">Transition</text>
</svg>
