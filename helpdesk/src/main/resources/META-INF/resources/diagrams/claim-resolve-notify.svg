<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect width="800" height="300" rx="12" fill="#0f172a"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" fill="#475569" font-size="10" text-transform="uppercase" letter-spacing="1">Work Item Lifecycle</text>

  <!-- Work item states -->
  <rect x="30" y="48" width="110" height="52" rx="8" fill="#1e293b" stroke="#1e3a5f" stroke-width="1"/>
  <text x="85" y="70" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">PENDING</text>
  <text x="85" y="86" text-anchor="middle" fill="#64748b" font-size="9">awaiting claim</text>

  <rect x="210" y="48" width="110" height="52" rx="8" fill="#1e293b" stroke="#713f12" stroke-width="1"/>
  <text x="265" y="70" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">IN_PROGRESS</text>
  <text x="265" y="86" text-anchor="middle" fill="#64748b" font-size="9">specialist working</text>

  <rect x="390" y="48" width="110" height="52" rx="8" fill="#1e293b" stroke="#166534" stroke-width="1"/>
  <text x="445" y="70" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="600">COMPLETED</text>
  <text x="445" y="86" text-anchor="middle" fill="#64748b" font-size="9">resolution entered</text>

  <!-- Arrows between work item states -->
  <line x1="140" y1="74" x2="210" y2="74" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="74" x2="390" y2="74" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action labels on arrows -->
  <text x="175" y="64" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="600">CLAIM</text>
  <text x="355" y="64" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="600">RESOLVE</text>

  <!-- Actor boxes -->
  <rect x="120" y="110" width="100" height="36" rx="6" fill="#172033" stroke="#1e3a5f" stroke-width="1"/>
  <text x="170" y="126" text-anchor="middle" fill="#94a3b8" font-size="10">🔧 Specialist</text>
  <text x="170" y="140" text-anchor="middle" fill="#64748b" font-size="9">claims &amp; starts</text>

  <rect x="300" y="110" width="100" height="36" rx="6" fill="#172033" stroke="#1e3a5f" stroke-width="1"/>
  <text x="350" y="126" text-anchor="middle" fill="#94a3b8" font-size="10">🔧 Specialist</text>
  <text x="350" y="140" text-anchor="middle" fill="#64748b" font-size="9">enters resolution</text>

  <!-- Dashed lines from actors to transitions -->
  <line x1="170" y1="110" x2="175" y2="80" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="350" y1="110" x2="355" y2="80" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Divider -->
  <line x1="30" y1="168" x2="770" y2="168" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="400" y="180" text-anchor="middle" fill="#475569" font-size="10" text-transform="uppercase" letter-spacing="1">Engine Choreography</text>

  <!-- Engine reaction chain -->
  <rect x="30" y="196" width="140" height="52" rx="8" fill="#172033" stroke="#1e3a5f" stroke-width="1"/>
  <text x="100" y="216" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">context change</text>
  <text x="100" y="232" text-anchor="middle" fill="#64748b" font-size="9">status → RESOLVED</text>

  <rect x="230" y="196" width="140" height="52" rx="8" fill="#172033" stroke="#1e3a5f" stroke-width="1"/>
  <text x="300" y="216" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">notify-customer</text>
  <text x="300" y="232" text-anchor="middle" fill="#64748b" font-size="9">binding fires</text>

  <rect x="430" y="196" width="140" height="52" rx="8" fill="#172033" stroke="#1e3a5f" stroke-width="1"/>
  <text x="500" y="216" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">📧 Notification</text>
  <text x="500" y="232" text-anchor="middle" fill="#64748b" font-size="9">sent to customer</text>

  <rect x="630" y="196" width="140" height="52" rx="8" fill="#14532d" stroke="#166534" stroke-width="1"/>
  <text x="700" y="216" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">✓ Case Complete</text>
  <text x="700" y="232" text-anchor="middle" fill="#86efac" font-size="9">goal met</text>

  <!-- Arrows in engine chain -->
  <line x1="170" y1="222" x2="230" y2="222" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="370" y1="222" x2="430" y2="222" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="570" y1="222" x2="630" y2="222" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Connecting arrow from work item COMPLETED to engine context change -->
  <path d="M 445 100 L 445 140 Q 445 160 420 168 L 100 168 Q 80 168 80 186 L 80 196" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="460" y="138" fill="#38bdf8" font-size="8" font-style="italic">triggers</text>

  <!-- Legend -->
  <text x="30" y="280" fill="#475569" font-size="9">No application code orchestrates this chain — the engine evaluates bindings on each context change</text>
</svg>
