quarkus.http.port=8090
quarkus.log.category."io.casehub.examples".level=DEBUG

# Datasource — H2 in-memory
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:helpdesk;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=false
quarkus.flyway.clean-disabled=false
quarkus.flyway.locations=classpath:db/work/migration,classpath:db/ledger/migration

# CORS — allow cross-origin requests from examples gallery
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

# Disable caching on static resources for development
quarkus.http.static-resources.caching-enabled=false

# Quartz — RAM store for worker scheduling
quarkus.quartz.store-type=ram

# Engine — memory and CBR retention defaults (not used, but required config)
casehub.memory.retention.domain=helpdesk
casehub.cbr.retention.case-types=none
casehub.cbr.retention.domain=helpdesk
casehub.cbr.trust-retention.case-types=none
casehub.cbr.trust-retention.domain=helpdesk

# Connector placeholders (not used in demo mode)
casehub.connectors.twilio.auth-token=unused
casehub.connectors.twilio.account-sid=unused
casehub.connectors.twilio.from=unused
casehub.connectors.whatsapp.phone-number-id=unused
casehub.connectors.whatsapp.api-token=unused
