quarkus.http.port=8190
casehub.pages.playbook.rest-base-url=http://localhost:${quarkus.http.port}
%test.casehub.pages.playbook.rest-base-url=http://localhost:${quarkus.http.test-port:8081}
quarkus.arc.exclude-types=\
  io.casehub.work.runtime.service.NoOpGroupMembershipProvider,\
  io.casehub.ledger.service.CaseLedgerEventCapture,\
  io.casehub.ledger.service.WorkerDecisionEventCapture,\
  io.casehub.ledger.quarkus.LedgerBeans,\
  io.casehub.ledger.quarkus.WorkerDecisionEventCaptureAdapter,\
  io.casehub.ledger.quarkus.CaseLedgerEventCaptureAdapter,\
  io.casehub.ledger.quarkus.TrustRoutingPreferenceRegistrarAdapter,\
  io.casehub.ledger.repository.CaseLedgerEntryRepository
quarkus.index-dependency.simulation-config.group-id=io.casehub
quarkus.index-dependency.simulation-config.artifact-id=casehub-platform-simulation-config
quarkus.log.category."io.casehub.examples".level=DEBUG

# Permit all APIs for demo/test mode
quarkus.http.auth.permission.permit-all.paths=/*
quarkus.http.auth.permission.permit-all.policy=permit
quarkus.smallrye-jwt.enabled=false

# Datasource — H2 in-memory
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:helpdesk-apps;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=false
quarkus.flyway.clean-disabled=false
quarkus.flyway.locations=classpath:db/work/migration,classpath:db/ledger/migration

# CORS — allow cross-origin requests
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

# Disable caching on static resources for development
quarkus.http.static-resources.caching-enabled=false

# Quartz — RAM store for worker scheduling
quarkus.quartz.store-type=ram

# Engine — memory and CBR retention defaults
casehub.memory.retention.domain=helpdesk
casehub.cbr.retention.case-types=none
casehub.cbr.retention.domain=helpdesk
casehub.cbr.trust-retention.case-types=none
casehub.cbr.trust-retention.domain=helpdesk

# Connector placeholders (not used in demo mode)
casehub.connectors.twilio.auth-token=unused
casehub.connectors.twilio.account-sid=unused
casehub.connectors.twilio.from=unused
casehub.connectors.whatsapp.phone-number-id=unused
casehub.connectors.whatsapp.api-token=unused
